name: Release

# Builds the Play Store upload bundle (signed with the upload key kept in
# repository secrets) and publishes it as a workflow artifact — and, on a
# version tag, as a GitHub Release. See docs/release.md.
#
# Secrets live in the "release" GitHub environment (Settings → Environments →
# release), which also lets you require a reviewer before a build runs:
#   ANDROID_UPLOAD_KEYSTORE_BASE64    the upload .jks, base64-encoded
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD  keystore password
#   ANDROID_UPLOAD_KEY_ALIAS          key alias
#   ANDROID_UPLOAD_KEY_PASSWORD       key password (optional, defaults to the
#                                     keystore password — PKCS12 keystores,
#                                     the keytool default, share one password)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # attach the bundle to the GitHub Release on a tag push

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Play Store bundle
    runs-on: ubuntu-latest
    environment: release
    env:
      # app/build.gradle.kts resolves storeFile against the repo root.
      KEYSTORE_FILE: release-key.jks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=(ANDROID_UPLOAD_KEYSTORE_BASE64)
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=(ANDROID_UPLOAD_KEYSTORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(ANDROID_UPLOAD_KEY_ALIAS)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing secrets in the 'release' environment: ${missing[*]}. See docs/release.md."
            exit 1
          fi

      # The build reads versionName/versionCode from app/build.gradle.kts and
      # the tag is only a label, so nothing downstream can catch a mismatch.
      # Fail here, in a second, rather than publish a bundle that contradicts
      # its release. A tag is `v` + versionName (v1.1.0).
      - name: Resolve version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName *= *"\(.*\)".*/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode *= *\([0-9]*\).*/\1/p' app/build.gradle.kts)
          if [ -z "$name" ] || [ -z "$code" ]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "${GITHUB_REF_NAME#v}" != "$name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME and app/build.gradle.kts (versionName $name) name different versions. A tag is 'v' + versionName — v$name here. Bump the version in a commit first, then tag that commit. See docs/release.md."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building $name ($code)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The same gates as CI and Lint: a release must never ship from a red tree.
      - name: Run unit tests
        run: ./gradlew test

      - name: Run lint, ktlint and detekt
        run: ./gradlew lint ktlintCheck detekt

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -o pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          cat > keystore.properties <<PROPS
          storeFile=$KEYSTORE_FILE
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          PROPS

      # Opens the keystore the way Gradle will, so a corrupt upload, a wrong
      # password or a missing alias fails here in a second instead of after
      # the compile. Prints the certificate fingerprint (public) so it can be
      # compared with `keytool -list` on the machine that made it.
      - name: Verify upload keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          size=$(stat -c %s "$KEYSTORE_FILE")
          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass:env KEYSTORE_PASSWORD \
               -alias "$KEY_ALIAS" > keytool.out 2>&1; then
            echo "::error::Cannot open key '$KEY_ALIAS' in the upload keystore ($size bytes): $(tr '\n' ' ' < keytool.out)— check ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_KEYSTORE_PASSWORD and ANDROID_UPLOAD_KEY_ALIAS. See docs/release.md."
            exit 1
          fi
          echo "Upload keystore OK ($size bytes): $(grep -i fingerprint keytool.out)"

      - name: Build app bundle
        run: ./gradlew bundleRelease

      # A signed release APK of the same build for a device sanity check
      # before uploading the bundle (the bundle itself cannot be sideloaded).
      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Collect outputs
        id: outputs
        run: |
          v="${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}"
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/lineflow-$v.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/lineflow-$v.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/lineflow-$v-mapping.txt"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lineflow-${{ steps.outputs.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: LineFlow ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          generate_release_notes: true
          files: dist/*

      - name: Remove signing material
        if: always()
        run: rm -f "$KEYSTORE_FILE" keystore.properties
