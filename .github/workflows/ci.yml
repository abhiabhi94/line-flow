name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests & debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the debug APK comment on PRs

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The level validation tests live in :shared and run on the host JVM.
      - name: Run unit tests
        run: ./gradlew :shared:jvmTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Debug = "app.curious.lineflow.debug", every level unlocked, installable
      # next to the Play build; a testable build of any push or PR.
      - name: Upload debug APK
        id: apk
        uses: actions/upload-artifact@v7
        with:
          name: lineflow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # One comment per PR, updated on every push, so the latest APK is one
      # click away for reviewers. (The web preview link is posted by
      # pr-preview.yml.)
      - name: Comment the APK link on the PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: debug-apk
          message: |
            📱 **Debug APK** for ${{ github.event.pull_request.head.sha }}: [download `lineflow-debug-apk`](${{ steps.apk.outputs.artifact-url }}) (zip; sign-in required, kept 14 days).

            Installs next to the Play build as `app.curious.lineflow.debug` with every level unlocked.

      - name: Upload build reports
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-reports
          path: |
            app/build/reports/
            shared/build/reports/
          retention-days: 7

  smoke:
    name: Web smoke & screenshots
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Builds the browser app, drives tutorial/home/levels/settings in headless
      # Chromium at a phone viewport, fails on any uncaught exception and
      # uploads the PNGs as the "screenshots" artifact for visual review.
      - name: Smoke test + screenshots
        uses: ./.github/actions/web-smoke
