name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the debug APK comment on PRs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

      # Debug = app.curious.lineflow.debug, installs next to the Play build,
      # so it is the build a reviewer wants on a phone.
      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: lineflow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # One comment per PR, updated on every push, so the latest APK is one
      # click away for reviewers.
      - name: Comment the APK link on the PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: debug-apk
          message: |
            📱 **Debug APK** for ${{ github.event.pull_request.head.sha }}: [download `lineflow-debug-apk`](${{ steps.apk.outputs.artifact-url }}) (zip; sign-in required, kept 14 days).

            Installs next to the Play build as `app.curious.lineflow.debug`.

      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: |
            app/build/reports/
          retention-days: 7
